name: Hariom Builds - Deploy to Dedicated Cloudflare Account

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/hariom-builds-account-smoke-test

permissions:
  contents: read

concurrency:
  group: hariom-builds-dedicated-cloudflare-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build OpenNext Worker
        run: npm run build:cloudflare

      - name: Deploy to dedicated Hariom Builds Cloudflare account
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.HARIOM_BUILDS_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.HARIOM_BUILDS_CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
